<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorise Mailer | Micro SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            500: '#14b8a6',
                            900: '#134e4a',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden text-gray-800 font-sans">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col hidden md:flex">
        <div class="p-6 flex items-center gap-3">
            <i class="ph ph-paper-plane-tilt text-3xl text-brand-500"></i>
            <span class="text-xl font-bold tracking-tight">Algorise<span class="text-brand-500">Mailer</span></span>
        </div>
        <nav class="flex-1 px-4 space-y-2 mt-4">
            <a href="#" id="linkDashboard" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-slate-800 hover:text-white transition-colors">
                <i class="ph ph-squares-four text-xl"></i> Dashboard
            </a>
            <a href="#" id="linkContatos" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-brand-500 text-white font-medium shadow-md">
                <i class="ph ph-users text-xl"></i> Contatos
            </a>
            <a href="#" id="linkCampanhas" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-slate-800 hover:text-white transition-colors">
                <i class="ph ph-megaphone text-xl"></i> Campanhas
            </a>
        </nav>
        <div class="p-4 border-t border-slate-700">
            <div class="flex items-center gap-3 px-4 py-2">
                <div class="w-8 h-8 rounded-full bg-brand-500 flex items-center justify-center font-bold">A</div>
                <div>
                    <p class="text-sm font-medium">Admin</p>
                    <p class="text-xs text-gray-400">Plano Pro</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="md:hidden bg-white shadow-sm p-4 flex justify-between items-center">
            <span class="text-xl font-bold">AlgoriseMailer</span>
            <button class="text-gray-600"><i class="ph ph-list text-2xl"></i></button>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <div id="viewRoot"></div>
        </div>
    </main>

    <!-- Modal Nova Campanha -->
    <div id="modalNovaCampanha" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-xl font-bold">Nova Campanha</h3>
                <button onclick="document.getElementById('modalNovaCampanha').classList.add('hidden')" class="text-gray-400 hover:text-gray-600">
                    <i class="ph ph-x text-2xl"></i>
                </button>
            </div>
            <form id="formCampanha" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome Interno</label>
                    <input type="text" id="campanha_nome" placeholder="Ex: Lançamento gptGOV" class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none focus:ring-2 focus:ring-brand-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Assunto do E-mail</label>
                    <input type="text" id="campanha_assunto" placeholder="O assunto que o cliente verá" class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none focus:ring-2 focus:ring-brand-500" required>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-sm font-medium text-gray-700">Conteúdo (HTML)</label>
                        <div class="relative">
                            <select id="selectTemplate" class="text-xs bg-brand-50 text-brand-500 pl-2 pr-6 py-1 rounded hover:bg-brand-100 transition-colors appearance-none cursor-pointer border border-brand-500/20 outline-none">
                                <option value="">-- Escolher Template --</option>
                                <option value="gptgov_academy">gptGOV Academy</option>
                            </select>
                            <i class="ph ph-caret-down absolute right-1.5 top-1/2 -translate-y-1/2 text-brand-500 text-xs pointer-events-none"></i>
                        </div>
                    </div>
                    <textarea rows="8" id="campanha_corpo" placeholder="Cole seu HTML aqui ou escolha um template acima..." class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none focus:ring-2 focus:ring-brand-500 font-mono text-sm" required></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" onclick="document.getElementById('modalNovaCampanha').classList.add('hidden')" class="px-6 py-2 text-gray-600">Cancelar</button>
                    <button type="submit" id="btnSalvar" class="px-6 py-2 bg-brand-500 text-white rounded-lg hover:bg-teal-600 transition-colors">Salvar Rascunho</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Import -->
    <div id="modalImport" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-xl w-80 text-center">
            <i class="ph ph-circle-notch animate-spin text-4xl text-brand-500 mb-4 mx-auto block"></i>
            <p class="font-medium">Processando...</p>
        </div>
    </div>

    <!-- Templates armazenados fora do script JS -->
    <script id="tpl_gptgov_academy" type="text/html"><!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:sans-serif;background:#f4f7f6;margin:0;padding:0}
.wrap{max-width:600px;margin:20px auto;background:#fff;border-radius:8px;overflow:hidden}
.cnt{padding:30px}
h1{color:#0d9488;font-size:24px}
p{color:#4b5563;line-height:1.6}
.cta{display:inline-block;background:#0d9488;color:#fff;padding:12px 24px;text-decoration:none;border-radius:6px;margin-top:20px;font-weight:bold}
.ft{padding:20px;text-align:center;font-size:12px;color:#9ca3af;border-top:1px solid #eee}
</style>
</head>
<body>
<div class="wrap">
<div class="cnt">
<h1>Olá, {{nome}}! 🚀</h1>
<p>Você gasta horas em tarefas repetitivas? O serviço público não precisa ser sinônimo de burocracia lenta.</p>
<p>Na <b>gptGOV Academy</b>, ensinamos servidores como você a usar IA e automações para ganhar tempo e produtividade.</p>
<ul style="list-style:none;padding:0">
<li style="margin-bottom:10px;color:#374151">✓ Redução de 40% no tempo de tarefas</li>
<li style="margin-bottom:10px;color:#374151">✓ Ferramentas modernas sem programar</li>
<li style="margin-bottom:10px;color:#374151">✓ Rede de servidores inovadores</li>
</ul>
<a href="https://gptgov.com.br/academy" class="cta">Quero Otimizar Meu Tempo</a>
</div>
<div class="ft">Atenciosamente, <b>Equipe gptGOV</b></div>
</div>
</body>
</html></script>

    <!-- Script Principal -->
    <script>
        const N8N_URLS = {
            inserir: 'https://n8n-n8n.yg64ke.easypanel.host/webhook/inserir-contato',
            listarContatos: 'https://n8n-n8n.yg64ke.easypanel.host/webhook/listar-contatos',
            criarCampanha: 'https://n8n-n8n.yg64ke.easypanel.host/webhook/criar-campanha',
            listarCampanhas: 'https://n8n-n8n.yg64ke.easypanel.host/webhook/listar-campanhas',
            dispararCampanha: 'https://n8n-n8n.yg64ke.easypanel.host/webhook/disparar-campanha'
        };
        const USUARIO_ID = 1;

        const TEMPLATE_MAP = {
            'gptgov_academy': {
                scriptId: 'tpl_gptgov_academy',
                nome: 'Divulgação gptGOV Academy',
                assunto: '🚀 Ganhe 4 horas do seu dia com a gptGOV Academy'
            }
        };

        // Carrega uma view HTML de src/views/<name>.html para o container #viewRoot
        async function loadView(name) {
            const container = document.getElementById('viewRoot');
            try {
                const res = await fetch(`src/views/${name}.html`);
                if (!res.ok) throw new Error('Falha ao carregar view');
                container.innerHTML = await res.text();
                if (name === 'contatos') setupContatos();
                if (name === 'dashboard') setupDashboard();
                if (name === 'campanhas') setupCampanhas();
                updateNavActive(name);
            } catch (err) {
                container.innerHTML = '<div class="p-8 text-red-500">Erro ao carregar a página.</div>';
                console.error(err);
            }
        }

        function updateNavActive(name) {
            const map = { linkDashboard: 'dashboard', linkContatos: 'contatos', linkCampanhas: 'campanhas' };
            Object.keys(map).forEach(function(k) {
                const el = document.getElementById(k);
                if (!el) return;
                if (map[k] === name) el.className = 'flex items-center gap-3 px-4 py-3 rounded-lg bg-brand-500 text-white font-medium shadow-md';
                else el.className = 'flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-slate-800 hover:text-white transition-colors';
            });
        }

        // ------- Dashboard view setup -------
        function setupDashboard() {
            const totalContatosEl = document.getElementById('dashTotalContatos');
            const totalAtivosEl = document.getElementById('dashContatosAtivos');
            const totalCampanhasEl = document.getElementById('dashTotalCampanhas');
            const campanhasConcluidasEl = document.getElementById('dashCampanhasConcluidas');
            const contatosRecentesEl = document.getElementById('dashContatosRecentes');
            const campanhasRecentesEl = document.getElementById('dashCampanhasRecentes');
            const chartContatosEl = document.getElementById('dashChartContatos');
            const chartCampanhasEl = document.getElementById('dashChartCampanhas');
            const statusEl = document.getElementById('dashStatus');

            function renderStatusChart(container, counters, colors) {
                if (!container) return;
                const entries = Object.keys(counters).map(function(key) {
                    return { key: key, value: counters[key] };
                }).filter(function(item) { return item.value > 0; });

                if (entries.length === 0) {
                    container.innerHTML = '<p class="text-gray-400 text-sm">Sem dados para exibir.</p>';
                    return;
                }

                const total = entries.reduce(function(sum, item) { return sum + item.value; }, 0);
                container.innerHTML = '';

                entries.sort(function(a, b) { return b.value - a.value; }).forEach(function(item) {
                    const percent = Math.round((item.value / total) * 100);
                    const row = document.createElement('div');
                    row.innerHTML =
                        '<div class="flex items-center justify-between mb-1">' +
                            '<span class="text-xs uppercase tracking-wider text-gray-600">' + item.key + '</span>' +
                            '<span class="text-xs font-semibold text-gray-700">' + item.value + ' (' + percent + '%)</span>' +
                        '</div>' +
                        '<div class="h-2.5 rounded-full bg-gray-100 overflow-hidden">' +
                            '<div class="h-full rounded-full ' + (colors[item.key] || 'bg-brand-500') + '" style="width:' + percent + '%"></div>' +
                        '</div>';
                    container.appendChild(row);
                });
            }

            function renderContatosRecentes(contatos) {
                if (!contatosRecentesEl) return;
                if (!contatos || contatos.length === 0) {
                    contatosRecentesEl.innerHTML = '<li class="text-gray-400">Nenhum contato encontrado.</li>';
                    return;
                }
                contatosRecentesEl.innerHTML = '';
                contatos.slice(0, 5).forEach(function(c) {
                    const li = document.createElement('li');
                    li.className = 'flex items-center justify-between py-2 border-b border-gray-100 last:border-b-0';
                    const nome = c.nome || 'Sem nome';
                    const email = c.email || '-';
                    const status = c.status || 'ativo';
                    li.innerHTML = '<div><p class="text-sm font-medium text-gray-900">' + nome + '</p><p class="text-xs text-gray-500">' + email + '</p></div><span class="text-[10px] uppercase font-bold px-2 py-1 rounded bg-brand-50 text-brand-500">' + status + '</span>';
                    contatosRecentesEl.appendChild(li);
                });
            }

            function renderCampanhasRecentes(campanhas) {
                if (!campanhasRecentesEl) return;
                if (!campanhas || campanhas.length === 0) {
                    campanhasRecentesEl.innerHTML = '<li class="text-gray-400">Nenhuma campanha criada.</li>';
                    return;
                }
                campanhasRecentesEl.innerHTML = '';
                campanhas.slice(0, 5).forEach(function(c) {
                    const li = document.createElement('li');
                    li.className = 'flex items-center justify-between py-2 border-b border-gray-100 last:border-b-0';
                    const nome = c.nome || 'Sem nome';
                    const assunto = c.assunto || '-';
                    const status = c.status || 'rascunho';
                    const statusClass = status === 'concluido' ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700';
                    li.innerHTML = '<div><p class="text-sm font-medium text-gray-900">' + nome + '</p><p class="text-xs text-gray-500">' + assunto + '</p></div><span class="text-[10px] uppercase font-bold px-2 py-1 rounded ' + statusClass + '">' + status + '</span>';
                    campanhasRecentesEl.appendChild(li);
                });
            }

            Promise.allSettled([
                fetch(N8N_URLS.listarContatos).then(function(res) { if (!res.ok) throw new Error('contatos'); return res.json(); }),
                fetch(N8N_URLS.listarCampanhas).then(function(res) { if (!res.ok) throw new Error('campanhas'); return res.json(); })
            ]).then(function(results) {
                const contatos = results[0].status === 'fulfilled' && Array.isArray(results[0].value) ? results[0].value : [];
                const campanhas = results[1].status === 'fulfilled' && Array.isArray(results[1].value) ? results[1].value : [];

                const totalContatos = contatos.length;
                const totalAtivos = contatos.filter(function(c) { return (c.status || 'ativo') === 'ativo'; }).length;
                const totalCampanhas = campanhas.length;
                const concluidas = campanhas.filter(function(c) { return c.status === 'concluido'; }).length;

                const contatosPorStatus = contatos.reduce(function(acc, c) {
                    const status = (c.status || 'ativo').toLowerCase();
                    acc[status] = (acc[status] || 0) + 1;
                    return acc;
                }, {});

                const campanhasPorStatus = campanhas.reduce(function(acc, c) {
                    const status = (c.status || 'rascunho').toLowerCase();
                    acc[status] = (acc[status] || 0) + 1;
                    return acc;
                }, {});

                if (totalContatosEl) totalContatosEl.textContent = String(totalContatos);
                if (totalAtivosEl) totalAtivosEl.textContent = String(totalAtivos);
                if (totalCampanhasEl) totalCampanhasEl.textContent = String(totalCampanhas);
                if (campanhasConcluidasEl) campanhasConcluidasEl.textContent = String(concluidas);

                renderContatosRecentes(contatos);
                renderCampanhasRecentes(campanhas);
                renderStatusChart(chartContatosEl, contatosPorStatus, {
                    ativo: 'bg-green-500',
                    inativo: 'bg-gray-500',
                    bloqueado: 'bg-red-500'
                });
                renderStatusChart(chartCampanhasEl, campanhasPorStatus, {
                    concluido: 'bg-green-500',
                    rascunho: 'bg-amber-500',
                    enviando: 'bg-blue-500',
                    erro: 'bg-red-500'
                });

                if (statusEl) {
                    if (results[0].status === 'fulfilled' && results[1].status === 'fulfilled') {
                        statusEl.textContent = 'Dados atualizados com sucesso.';
                        statusEl.className = 'text-xs text-green-600';
                    } else {
                        statusEl.textContent = 'Alguns dados não puderam ser carregados.';
                        statusEl.className = 'text-xs text-orange-600';
                    }
                }
            }).catch(function() {
                if (statusEl) {
                    statusEl.textContent = 'Erro ao carregar métricas do dashboard.';
                    statusEl.className = 'text-xs text-red-600';
                }
            });

            const btnIrContatos = document.getElementById('btnIrContatos');
            const btnIrCampanhas = document.getElementById('btnIrCampanhas');
            if (btnIrContatos) btnIrContatos.addEventListener('click', function() { loadView('contatos'); });
            if (btnIrCampanhas) btnIrCampanhas.addEventListener('click', function() { loadView('campanhas'); });
        }

        // ------- Contatos view setup -------
        function setupContatos() {
            const fileInput = document.getElementById('fileInput');
            const tabelaContatos = document.getElementById('tabelaContatos');
            const totalContatosEl = document.getElementById('totalContatos');

            if (fileInput) {
                fileInput.addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = function(event) { processCSV(event.target.result); };
                    reader.readAsText(file);
                });
            }

            function processCSV(csv) {
                const lines = csv.split(/\r?\n/).filter(l => l.trim() !== '');
                const modal = document.getElementById('modalImport');
                if (modal) modal.classList.remove('hidden');
                let sucessos = 0;
                let i = 1;

                function enviarProximo() {
                    if (i >= lines.length) {
                        if (modal) modal.classList.add('hidden');
                        atualizarContagem();
                        if (sucessos > 0) alert(sucessos + ' contatos importados!');
                        else alert('Nenhum contato importado. Verifique o CSV.');
                        if (fileInput) fileInput.value = '';
                        return;
                    }
                    const row = lines[i].split(/[,;]/);
                    i++;
                    if (row.length >= 2) {
                        const nome = row[0].replace(/["']/g, '').trim();
                        const email = row[1].replace(/["']/g, '').trim();
                        const tags = row[2] ? row[2].replace(/["']/g, '').trim() : 'importado-csv';
                        if (email.indexOf('@') > -1) {
                            const contato = { nome: nome, email: email, usuario_id: USUARIO_ID, tags: tags, status: 'ativo' };
                            fetch(N8N_URLS.inserir, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(contato) })
                            .then(res => { if (res.ok) { sucessos++; addLinhaTabela(contato); } enviarProximo(); })
                            .catch(() => enviarProximo());
                            return;
                        }
                    }
                    enviarProximo();
                }
                enviarProximo();
            }

            function addLinhaTabela(contato) {
                if (!tabelaContatos) return;
                if (tabelaContatos.innerText.indexOf('Nenhum contato') > -1) tabelaContatos.innerHTML = '';
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 border-b border-gray-100';
                const td1 = document.createElement('td'); td1.className = 'p-4 font-medium text-gray-900'; td1.textContent = contato.nome;
                const td2 = document.createElement('td'); td2.className = 'p-4 text-gray-600'; td2.textContent = contato.email;
                const td3 = document.createElement('td'); td3.className = 'p-4';
                const span = document.createElement('span'); span.className = 'bg-brand-50 text-brand-500 px-2 py-1 rounded text-xs'; span.textContent = contato.tags;
                td3.appendChild(span);
                const td4 = document.createElement('td'); td4.className = 'p-4'; td4.innerHTML = '<span class="text-green-700 text-xs">Ativo</span>';
                const td5 = document.createElement('td'); td5.className = 'p-4 text-right'; td5.textContent = '...';
                tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3); tr.appendChild(td4); tr.appendChild(td5);
                tabelaContatos.appendChild(tr);
            }

            function atualizarContagem() {
                if (!totalContatosEl || !tabelaContatos) return;
                totalContatosEl.textContent = tabelaContatos.querySelectorAll('tr').length;
            }

            function carregarContatos() {
                if (!tabelaContatos) return;
                fetch(N8N_URLS.listarContatos).then(function(res) { if (res.ok) return res.json(); else throw new Error(); })
                .then(function(data) { tabelaContatos.innerHTML = ''; if (data && data.length > 0) { data.forEach(function(c) { addLinhaTabela(c); }); } atualizarContagem(); })
                .catch(function() {});
            }

            // iniciar carregamento
            carregarContatos();
        }

        // ------- Campanhas view setup -------
        function setupCampanhas() {
            const selectTemplate = document.getElementById('selectTemplate');
            const campanhaCorpo = document.getElementById('campanha_corpo');
            const campanhaNome = document.getElementById('campanha_nome');
            const campanhaAssunto = document.getElementById('campanha_assunto');
            const gridCampanhas = document.getElementById('gridCampanhas');

            if (selectTemplate) {
                selectTemplate.addEventListener('change', function() {
                    const key = this.value;
                    if (!key || !TEMPLATE_MAP[key]) return;
                    const tpl = TEMPLATE_MAP[key];
                    const el = document.getElementById(tpl.scriptId);
                    if (el && campanhaCorpo) {
                        campanhaCorpo.value = el.innerHTML;
                        if (campanhaNome) campanhaNome.value = tpl.nome;
                        if (campanhaAssunto) campanhaAssunto.value = tpl.assunto;
                    }
                    this.value = '';
                });
            }

            async function dispararCampanha(campanhaId) {
                if (!confirm("Deseja disparar esta campanha agora para TODOS os contatos ativos?")) return;
                try {
                    const response = await fetch(N8N_URLS.dispararCampanha, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ campanha_id: campanhaId, usuario_id: USUARIO_ID }) });
                    if (response.ok) { alert('Campanha enviada para a fila de disparo!'); carregarCampanhas(); }
                    else alert('Erro ao disparar campanha. Verifique o workflow no n8n.');
                } catch (err) { console.error(err); alert('Falha na conexão com o servidor de disparo.'); }
            }

            function carregarCampanhas() {
                if (!gridCampanhas) return;
                fetch(N8N_URLS.listarCampanhas).then(function(res) { if (res.ok) return res.json(); else throw new Error(); })
                .then(function(data) {
                    if (data && data.length > 0) {
                        gridCampanhas.innerHTML = '';
                        data.forEach(function(c) {
                            const div = document.createElement('div');
                            div.className = 'bg-white p-6 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-shadow';
                            const h4 = document.createElement('h4'); h4.className = 'font-bold text-gray-900'; h4.textContent = c.nome;
                            const p = document.createElement('p'); p.className = 'text-sm text-gray-500 mt-2'; p.textContent = c.assunto;
                            const footer = document.createElement('div'); footer.className = 'flex justify-between items-center mt-4 pt-4 border-t border-gray-50';
                            const status = document.createElement('span'); status.className = `text-[10px] uppercase font-bold px-2 py-0.5 rounded ${c.status === 'concluido' ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'}`; status.textContent = c.status || 'rascunho';
                            const btn = document.createElement('button'); btn.className = `text-sm font-bold ${c.status === 'concluido' ? 'text-gray-400 cursor-not-allowed' : 'text-brand-500 hover:text-teal-600'}`; btn.textContent = c.status === 'concluido' ? 'Enviada' : 'Enviar Agora';
                            if (c.status !== 'concluido') btn.onclick = function() { dispararCampanha(c.id); };
                            footer.appendChild(status); footer.appendChild(btn);
                            div.appendChild(h4); div.appendChild(p); div.appendChild(footer); gridCampanhas.appendChild(div);
                        });
                    }
                }).catch(function() {});
            }

            // salvar campanha (form)
            const formCampanha = document.getElementById('formCampanha');
            if (formCampanha) {
                formCampanha.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const btn = document.getElementById('btnSalvar');
                    btn.textContent = 'Salvando...'; btn.disabled = true;
                    const payload = { usuario_id: USUARIO_ID, nome: campanhaNome.value, assunto: campanhaAssunto.value, corpo_html: campanhaCorpo.value, status: 'rascunho' };
                    fetch(N8N_URLS.criarCampanha, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
                    .then(function(res) { if (res.ok) { alert('Campanha salva como rascunho!'); document.getElementById('modalNovaCampanha').classList.add('hidden'); formCampanha.reset(); carregarCampanhas(); } else { return res.text().then(function(t) { alert('Erro: ' + t); }); } })
                    .catch(function(err) { alert('Falha na conexão: ' + err.message); }).finally(function() { btn.textContent = 'Salvar Rascunho'; btn.disabled = false; });
                });
            }

            carregarCampanhas();
        }

        // Navegação: ligar links para carregar views
        const navMap = { linkDashboard: 'dashboard', linkContatos: 'contatos', linkCampanhas: 'campanhas' };
        Object.keys(navMap).forEach(function(id) { const el = document.getElementById(id); if (!el) return; el.addEventListener('click', function(e) { e.preventDefault(); loadView(navMap[id]); }); });

        // Carrega view inicial
        loadView('dashboard');
    </script>
</body>
</html>
